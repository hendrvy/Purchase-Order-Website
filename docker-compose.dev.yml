services:
  postgres:
    image: postgres:17
    container_name: postgres-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-purchase_order}
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    container_name: go-api-dev
    expose:
      - "3455"
    ports:
      - "3455:3455"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network
    environment:
      - ENVIRONMENT=development

  nginx:
    build:
      context: .  
      dockerfile: backend/docker/Dockerfile.nginx
    container_name: nginx-web-dev
    expose:
      - "80"
    ports:
      - "81:80"
    depends_on:
      - api
    networks:
      - dev-network

volumes:
  postgres_data_dev: {}

networks:
  dev-network:
    driver: bridge
