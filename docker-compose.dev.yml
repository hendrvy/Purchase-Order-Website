# Development compose file - hot-reload for both backend and frontend so
# editing code never requires `docker compose build` again after the
# first run. Production still uses docker-compose.yml unchanged (that
# file is untouched by this one).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build   # first run (or after changing go.mod/package.json)
#   docker compose -f docker-compose.dev.yml up           # subsequent runs
#
# - Editing backend/**/*.go        -> air detects it, rebuilds + restarts the Go binary automatically.
# - Editing frontend/src/**        -> vite (in --watch mode) rebuilds dist/ automatically; just refresh the browser.
# - Editing go.mod/go.sum or package.json -> re-run with --build once to pick up new dependencies.
services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.dev
    container_name: go-api
    ports:
      - "3455:3455"
    env_file:
      - .env
    volumes:
      # Bind-mount the Go source so air can see edits instantly. go.sum
      # is included so `go mod download` results (cached in the image
      # layer) stay valid; a named volume for the module cache means
      # `go mod download` after a dependency change doesn't re-fetch
      # everything from scratch either.
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      - postgres

  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-builder
    volumes:
      - ./frontend:/app
      # Anonymous volume so the bind mount above doesn't shadow the
      # node_modules installed during image build (npm ci) with the
      # host's frontend/node_modules, which may not even exist locally.
      - /app/node_modules
      # Shared with nginx below so nginx serves whatever vite just
      # rebuilt into dist/, with no manual copy step.
      - frontend_dist:/app/dist

  nginx:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend-builder

volumes:
  postgres_data:
  go_mod_cache:
  frontend_dist:
