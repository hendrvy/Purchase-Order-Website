services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    container_name: go-api
    ports:
      - "3455:3455"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - dokploy-network

  nginx:
    build:
      context: .  
      dockerfile: backend/docker/Dockerfile.nginx
    container_name: nginx-web
    ports:
      - "81:80"
    depends_on:
      - api
    networks:
      - dokploy-network

volumes:
  postgres_data

networks:
  dokploy-network:
    external: true